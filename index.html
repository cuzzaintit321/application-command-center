<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Application Command Center</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React, ReactDOM & Babel for in-browser JSX execution -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Firebase v10 Compat SDKs (works directly in standalone HTML without a bundler) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <style>
    body {
      background-color: #020617;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // ==========================================
    // CONSTANTS & STRICT V1 SPECIFICATION RULES
    // ==========================================
    const ALLOWED_STATUSES = [
      'Saved',
      'Applied',
      'Assessment',
      'Interview',
      'Offer',
      'Rejected',
      'Withdrawn'
    ];

    const TRACKING_PARAMS = new Set([
      'utm_source', 'utm_medium', 'utm_campaign', 'utm_term', 'utm_content', 'utm_id',
      'fbclid', 'gclid', 'msclkid', 'mc_cid', 'mc_eid', '_ga', '_gl',
      'ref', 'referrer', 'source', 'src', 'trk', 'trkinfo', 'trackingid', 'lipi', 'lici'
    ]);

    const COMPANY_SUFFIXES = /\b(inc|llc|ltd|corp|corporation|company|co|technologies|technology|systems|solutions|group)\b/gi;

    const ROLE_SYNONYMS = {
      'admin': 'administrator',
      'sysadmin': 'systems administrator',
      'sys': 'systems',
      'sr': 'senior',
      'jr': 'junior',
      'eng': 'engineer',
      'engr': 'engineer',
      'ops': 'operations',
      'devops': 'development operations',
      'sec': 'security',
      'infra': 'infrastructure'
    };

    const STORAGE_KEYS = {
      FIREBASE_CONFIG: 'acc_firebase_config_v1',
      DEMO_MODE: 'acc_explicit_demo_mode_v1',
      DEMO_APPS: 'acc_demo_applications_v1',
      DEMO_PREFS: 'acc_demo_preferences_v1'
    };

    // ==========================================
    // UTILITY FUNCTIONS (DATES, URL, DUPLICATES, CSV)
    // ==========================================

    // Local YYYY-MM-DD (Never raw UTC slice)
    function getLocalTodayStr() {
      const d = new Date();
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function diffDaysLocal(targetDateStr, todayStr) {
      if (!targetDateStr) return null;
      const [ty, tm, td] = targetDateStr.split('-').map(Number);
      const [cy, cm, cd] = todayStr.split('-').map(Number);
      if (!ty || !tm || !td) return null;
      const targetUTC = Date.UTC(ty, tm - 1, td);
      const todayUTC = Date.UTC(cy, cm - 1, cd);
      return Math.round((targetUTC - todayUTC) / (1000 * 60 * 60 * 24));
    }

    function generateId(prefix = 'app') {
      if (typeof crypto !== 'undefined' && crypto.randomUUID) {
        return `${prefix}_${crypto.randomUUID()}`;
      }
      return `${prefix}_${Date.now()}_${Math.random().toString(36).substring(2, 9)}`;
    }

    function formatLocalTimestamp(isoString) {
      if (!isoString) return '';
      const d = new Date(isoString);
      if (isNaN(d.getTime())) return isoString;
      return d.toLocaleString(undefined, {
        year: 'numeric', month: 'short', day: 'numeric',
        hour: '2-digit', minute: '2-digit'
      });
    }

    // URL Normalization: Lowercase hostname ONLY, preserve path/query case, remove known tracking params
    function normalizeJobUrl(rawUrl) {
      if (!rawUrl || !rawUrl.trim()) return '';
      let trimmed = rawUrl.trim();
      try {
        const hasProtocol = /^[a-zA-Z][a-zA-Z\d+\-.]*:\/\//.test(trimmed);
        const urlObj = new URL(hasProtocol ? trimmed : `https://${trimmed}`);
        const hostname = urlObj.hostname.toLowerCase();
        let pathname = urlObj.pathname;
        if (pathname.length > 1) {
          pathname = pathname.replace(/\/+$/, '');
        }
        const keptParams = [];
        urlObj.searchParams.forEach((val, key) => {
          if (!TRACKING_PARAMS.has(key.toLowerCase())) {
            keptParams.push([key, val]);
          }
        });
        keptParams.sort((a, b) => a[0].localeCompare(b[0]));
        const searchStr = keptParams.length > 0
          ? '?' + keptParams.map(([k, v]) => `${encodeURIComponent(k)}=${encodeURIComponent(v)}`).join('&')
          : '';
        return `${hostname}${pathname}${searchStr}`;
      } catch (e) {
        return trimmed.replace(/\s+/g, ' ');
      }
    }

    function normalizeText(str) {
      if (!str) return '';
      return str
        .toLowerCase()
        .replace(/[.,/#!$%^&*;:{}=\-_~()]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function normalizeCompanyCore(str) {
      const base = normalizeText(str);
      const stripped = base.replace(COMPANY_SUFFIXES, ' ').replace(/\s+/g, ' ').trim();
      return stripped || base;
    }

    function tokenizeTitle(str) {
      const base = normalizeText(str);
      if (!base) return [];
      const rawTokens = base.split(' ').filter(Boolean);
      const expanded = [];
      for (const t of rawTokens) {
        if (ROLE_SYNONYMS[t]) {
          expanded.push(...ROLE_SYNONYMS[t].split(' '));
        } else {
          expanded.push(t);
        }
      }
      return Array.from(new Set(expanded));
    }

    function checkDuplicateMatch(candidate, existingRecord) {
      const reasons = [];

      // 1. Check URL match
      const candUrl = normalizeJobUrl(candidate.postingUrl);
      const existUrl = normalizeJobUrl(existingRecord.postingUrl);
      if (candUrl && existUrl && candUrl === existUrl) {
        reasons.push('Identical Posting URL (normalized)');
      }

      // 2. Check Exact Company + Job Title
      const candCompNorm = normalizeText(candidate.company);
      const existCompNorm = normalizeText(existingRecord.company);
      const candTitleNorm = normalizeText(candidate.jobTitle);
      const existTitleNorm = normalizeText(existingRecord.jobTitle);

      if (candCompNorm && existCompNorm && candCompNorm === existCompNorm && candTitleNorm === existTitleNorm) {
        reasons.push('Exact Company & Job Title match');
      } else if (candCompNorm && existCompNorm) {
        // 3. Check Fuzzy/Similar Company + Title
        const cCore1 = normalizeCompanyCore(candidate.company);
        const cCore2 = normalizeCompanyCore(existingRecord.company);
        const companySimilar = cCore1 === cCore2 ||
          (cCore1.length >= 4 && cCore2.length >= 4 && (cCore1.includes(cCore2) || cCore2.includes(cCore1)));

        if (companySimilar) {
          const tokens1 = tokenizeTitle(candidate.jobTitle);
          const tokens2 = tokenizeTitle(existingRecord.jobTitle);
          if (tokens1.length > 0 && tokens2.length > 0) {
            const intersection = tokens1.filter(t => tokens2.includes(t));
            const union = new Set([...tokens1, ...tokens2]);
            const jaccard = intersection.length / union.size;
            if (jaccard >= 0.6) {
              reasons.push('Similar Company & Job Title');
            }
          }
        }
      }

      return {
        isDuplicate: reasons.length > 0,
        reasons
      };
    }

    // RFC 4180 CSV Escaping & Parsing
    const CSV_HEADERS = [
      'id', 'company', 'jobTitle', 'status', 'postingUrl', 'salaryRange',
      'location', 'applicationDate', 'deadline', 'followUpDate', 'notes', 'activityHistory'
    ];

    function escapeCsvCell(value) {
      const str = value === null || value === undefined ? '' : String(value);
      if (/[",\r\n]/.test(str)) {
        return `"${str.replace(/"/g, '""')}"`;
      }
      return str;
    }

    function serializeApplicationsToCsv(applications) {
      const lines = [CSV_HEADERS.join(',')];
      for (const app of applications) {
        const historyJson = JSON.stringify(Array.isArray(app.activityHistory) ? app.activityHistory : []);
        const row = [
          escapeCsvCell(app.id),
          escapeCsvCell(app.company),
          escapeCsvCell(app.jobTitle),
          escapeCsvCell(app.status),
          escapeCsvCell(app.postingUrl || ''),
          escapeCsvCell(app.salaryRange || ''),
          escapeCsvCell(app.location || ''),
          escapeCsvCell(app.applicationDate || ''),
          escapeCsvCell(app.deadline || ''),
          escapeCsvCell(app.followUpDate || ''),
          escapeCsvCell(app.notes || ''),
          escapeCsvCell(historyJson)
        ];
        lines.push(row.join(','));
      }
      return lines.join('\r\n');
    }

    // Full RFC 4180 State-Machine Parser (supports multi-line notes & escaped quotes in JSON)
    function parseRfc4180Csv(text) {
      const rows = [];
      let currentRow = [];
      let currentField = '';
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        const next = text[i + 1];

        if (inQuotes) {
          if (ch === '"' && next === '"') {
            currentField += '"';
            i++;
          } else if (ch === '"') {
            inQuotes = false;
          } else {
            currentField += ch;
          }
        } else {
          if (ch === '"') {
            inQuotes = true;
          } else if (ch === ',') {
            currentRow.push(currentField);
            currentField = '';
          } else if (ch === '\r' && next === '\n') {
            currentRow.push(currentField);
            rows.push(currentRow);
            currentRow = [];
            currentField = '';
            i++;
          } else if (ch === '\n' || ch === '\r') {
            currentRow.push(currentField);
            rows.push(currentRow);
            currentRow = [];
            currentField = '';
          } else {
            currentField += ch;
          }
        }
      }
      if (currentField.length > 0 || currentRow.length > 0) {
        currentRow.push(currentField);
        rows.push(currentRow);
      }
      return rows;
    }

    // Deduplicate and merge activityHistory arrays by event.id
    function mergeActivityHistories(existingHistory = [], importedHistory = []) {
      const map = new Map();
      for (const evt of existingHistory) {
        if (evt && evt.id) map.set(evt.id, evt);
      }
      for (const evt of importedHistory) {
        if (evt && evt.id && !map.has(evt.id)) {
          map.set(evt.id, evt);
        }
      }
      return Array.from(map.values()).sort((a, b) =>
        new Date(a.timestamp).getTime() - new Date(b.timestamp).getTime()
      );
    }

    // ==========================================
    // STATUS STYLING HELPERS
    // ==========================================
    function getStatusBadgeClasses(status) {
      switch (status) {
        case 'Saved': return 'bg-slate-800 text-slate-200 border-slate-700';
        case 'Applied': return 'bg-sky-950/80 text-sky-300 border-sky-700/50';
        case 'Assessment': return 'bg-purple-950/80 text-purple-300 border-purple-700/50';
        case 'Interview': return 'bg-amber-950/80 text-amber-300 border-amber-700/50';
        case 'Offer': return 'bg-emerald-950/80 text-emerald-300 border-emerald-700/50';
        case 'Rejected': return 'bg-rose-950/80 text-rose-300 border-rose-700/50';
        case 'Withdrawn': return 'bg-zinc-900 text-zinc-400 border-zinc-700';
        default: return 'bg-slate-800 text-slate-300 border-slate-700';
      }
    }

    // ==========================================
    // MAIN APPLICATION COMPONENT
    // ==========================================
    function App() {
      // Storage & Auth State: 'unconfigured' | 'firebase' | 'demo'
      const [mode, setMode] = useState('unconfigured');
      const [user, setUser] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);
      const [cloudError, setCloudError] = useState(null);

      // Data State
      const [applications, setApplications] = useState([]);
      const [warningWindowDays, setWarningWindowDays] = useState(3);

      // UI & Filter State
      const [searchQuery, setSearchQuery] = useState('');
      const [statusFilter, setStatusFilter] = useState('All');
      const [sortBy, setSortBy] = useState('updatedAt');
      const [sortAsc, setSortAsc] = useState(false);

      // Modals State
      const [showSetupModal, setShowSetupModal] = useState(false);
      const [editingApp, setEditingApp] = useState(null);
      const [isAppModalOpen, setIsAppModalOpen] = useState(false);
      const [isCsvModalOpen, setIsCsvModalOpen] = useState(false);

      // Prompt: Saved -> Applied Optional Application Date Modal
      const [appliedDatePrompt, setAppliedDatePrompt] = useState(null);
      // { appId, pendingAppPayload, isQuickStatusChange, tempDate }

      // Prompt: Follow-Up Completed -> Optional Schedule Next Follow-Up
      const [nextFollowUpPrompt, setNextFollowUpPrompt] = useState(null);
      // { appId, company, jobTitle, tempDate }

      // Inline Edit Date Popover on Reminder Card
      const [inlineDateEdit, setInlineDateEdit] = useState(null);
      // { appId, field: 'deadline' | 'followUpDate', value }

      // Firebase Instance Refs
      const dbRef = useRef(null);
      const authRef = useRef(null);
      const unsubscribeAppsRef = useRef(null);
      const unsubscribePrefsRef = useRef(null);

      // ------------------------------------------
      // INITIALIZE AUTH / DEMO MODE
      // ------------------------------------------
      useEffect(() => {
        const storedConfigRaw = localStorage.getItem(STORAGE_KEYS.FIREBASE_CONFIG);
        const explicitDemo = localStorage.getItem(STORAGE_KEYS.DEMO_MODE) === 'true';

        if (storedConfigRaw) {
          try {
            const config = JSON.parse(storedConfigRaw);
            initFirebaseClient(config);
          } catch (err) {
            setCloudError(`Invalid stored Firebase configuration: ${err.message}`);
            setAuthLoading(false);
          }
        } else if (explicitDemo) {
          activateLocalDemoMode();
          setAuthLoading(false);
        } else {
          setMode('unconfigured');
          setAuthLoading(false);
        }

        return () => cleanupListeners();
      }, []);

      function cleanupListeners() {
        if (unsubscribeAppsRef.current) {
          unsubscribeAppsRef.current();
          unsubscribeAppsRef.current = null;
        }
        if (unsubscribePrefsRef.current) {
          unsubscribePrefsRef.current();
          unsubscribePrefsRef.current = null;
        }
      }

      function initFirebaseClient(config) {
        setCloudError(null);
        try {
          let app;
          if (!firebase.apps.length) {
            app = firebase.initializeApp(config);
          } else {
            app = firebase.app();
          }
          const auth = firebase.auth(app);
          const db = firebase.firestore(app);
          authRef.current = auth;
          dbRef.current = db;
          setMode('firebase');

          auth.onAuthStateChanged(
            (fbUser) => {
              cleanupListeners();
              setUser(fbUser);
              setAuthLoading(false);
              if (fbUser) {
                attachFirestoreListeners(db, fbUser.uid);
              } else {
                setApplications([]);
              }
            },
            (err) => {
              // Strict Rule: Never silently switch to demo mode
              setCloudError(`Firebase Authentication error: ${err.message}`);
              setAuthLoading(false);
            }
          );
        } catch (err) {
          setCloudError(`Firebase initialization failed: ${err.message}`);
          setAuthLoading(false);
        }
      }

      function attachFirestoreListeners(db, uid) {
        const appsRef = db.collection('users').doc(uid).collection('applications');
        unsubscribeAppsRef.current = appsRef.onSnapshot(
          (snapshot) => {
            const list = [];
            snapshot.forEach((doc) => list.push(doc.data()));
            setApplications(list);
          },
          (err) => {
            setCloudError(
              `Firestore Read Error (${err.code || 'Error'}): ${err.message}. Verify that your Firestore Security Rules are published and allow /users/{userId} access.`
            );
          }
        );

        const prefsRef = db.collection('users').doc(uid).collection('settings').doc('preferences');
        unsubscribePrefsRef.current = prefsRef.onSnapshot(
          (doc) => {
            if (doc.exists && typeof doc.data().warningWindowDays === 'number') {
              setWarningWindowDays(doc.data().warningWindowDays);
            }
          },
          () => {} // Ignore preference read error if rules error already caught above
        );
      }

      function activateLocalDemoMode() {
        cleanupListeners();
        localStorage.setItem(STORAGE_KEYS.DEMO_MODE, 'true');
        setMode('demo');
        setUser(null);
        setCloudError(null);
        try {
          const rawApps = localStorage.getItem(STORAGE_KEYS.DEMO_APPS);
          setApplications(rawApps ? JSON.parse(rawApps) : []);
          const rawPrefs = localStorage.getItem(STORAGE_KEYS.DEMO_PREFS);
          if (rawPrefs) {
            const p = JSON.parse(rawPrefs);
            if (typeof p.warningWindowDays === 'number') setWarningWindowDays(p.warningWindowDays);
          }
        } catch (e) {
          setApplications([]);
        }
      }

      function exitLocalDemoMode() {
        localStorage.removeItem(STORAGE_KEYS.DEMO_MODE);
        const hasFb = !!localStorage.getItem(STORAGE_KEYS.FIREBASE_CONFIG);
        setMode(hasFb ? 'firebase' : 'unconfigured');
        setApplications([]);
      }

      async function handleGoogleSignIn() {
        setCloudError(null);
        if (!authRef.current) {
          setShowSetupModal(true);
          return;
        }
        const provider = new firebase.auth.GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });
        try {
          await authRef.current.signInWithPopup(provider);
          localStorage.removeItem(STORAGE_KEYS.DEMO_MODE);
        } catch (err) {
          if (err.code === 'auth/popup-blocked') {
            try {
              await authRef.current.signInWithRedirect(provider);
            } catch (redirErr) {
              setCloudError(`Google Sign-In failed: ${redirErr.message}`);
            }
          } else {
            setCloudError(
              `Google Sign-In failed (${err.code || 'Auth Error'}): ${err.message}. Check that Google Sign-In is enabled in Firebase Console and "${window.location.hostname || 'localhost'}" is in Authorized Domains.`
            );
          }
        }
      }

      async function handleSignOut() {
        setCloudError(null);
        if (mode === 'demo') {
          exitLocalDemoMode();
          return;
        }
        if (authRef.current) {
          try {
            await authRef.current.signOut();
          } catch (err) {
            setCloudError(`Sign-out error: ${err.message}`);
          }
        }
      }

      // ------------------------------------------
      // DATA PERSISTENCE OPERATIONS (CLOUD OR DEMO)
      // ------------------------------------------
      async function saveWarningWindow(days) {
        const clamped = Math.max(1, Math.min(60, Number(days) || 3));
        setWarningWindowDays(clamped);
        if (mode === 'firebase' && user && dbRef.current) {
          try {
            await dbRef.current
              .collection('users')
              .doc(user.uid)
              .collection('settings')
              .doc('preferences')
              .set({ warningWindowDays: clamped }, { merge: true });
          } catch (err) {
            setCloudError(`Failed to save warning window setting: ${err.message}`);
          }
        } else if (mode === 'demo') {
          localStorage.setItem(STORAGE_KEYS.DEMO_PREFS, JSON.stringify({ warningWindowDays: clamped }));
        }
      }

      async function persistApplicationRecord(record) {
        setCloudError(null);
        if (mode === 'firebase') {
          if (!user || !dbRef.current) {
            setCloudError('Cannot save: You must be signed in with Google to save to Firebase.');
            throw new Error('Not authenticated');
          }
          try {
            await dbRef.current
              .collection('users')
              .doc(user.uid)
              .collection('applications')
              .doc(record.id)
              .set(record);
          } catch (err) {
            // Strict rule: Never silently switch to demo mode when cloud saving fails
            setCloudError(`Failed to save application to Cloud Firestore: ${err.message}`);
            throw err;
          }
        } else if (mode === 'demo') {
          setApplications((prev) => {
            const exists = prev.some((a) => a.id === record.id);
            const next = exists
              ? prev.map((a) => (a.id === record.id ? record : a))
              : [record, ...prev];
            localStorage.setItem(STORAGE_KEYS.DEMO_APPS, JSON.stringify(next));
            return next;
          });
        } else {
          setCloudError('Storage is not configured. Connect Firebase or enter Local Demo Mode.');
          throw new Error('Unconfigured storage');
        }
      }

      async function deleteApplicationRecord(id) {
        setCloudError(null);
        if (mode === 'firebase') {
          if (!user || !dbRef.current) {
            setCloudError('Cannot delete: Not signed in.');
            return;
          }
          try {
            await dbRef.current
              .collection('users')
              .doc(user.uid)
              .collection('applications')
              .doc(id)
              .delete();
          } catch (err) {
            setCloudError(`Failed to delete record from Firestore: ${err.message}`);
          }
        } else if (mode === 'demo') {
          setApplications((prev) => {
            const next = prev.filter((a) => a.id !== id);
            localStorage.setItem(STORAGE_KEYS.DEMO_APPS, JSON.stringify(next));
            return next;
          });
        }
      }

      // ------------------------------------------
      // STATUS TRANSITION & FOLLOW-UP QUICK ACTIONS
      // ------------------------------------------
      async function handleQuickStatusChange(app, newStatus) {
        if (app.status === newStatus) return;
        const now = new Date().toISOString();
        const statusEvent = {
          id: generateId('evt'),
          timestamp: now,
          type: 'status_change',
          detail: `Status changed from ${app.status} to ${newStatus}`
        };
        const updatedApp = {
          ...app,
          status: newStatus,
          activityHistory: [...(app.activityHistory || []), statusEvent],
          updatedAt: now
        };

        // Rule: Changing Saved -> Applied with blank applicationDate leaves it blank & offers optional prompt
        if (app.status === 'Saved' && newStatus === 'Applied' && !app.applicationDate) {
          await persistApplicationRecord(updatedApp);
          setAppliedDatePrompt({
            appId: updatedApp.id,
            company: updatedApp.company,
            jobTitle: updatedApp.jobTitle,
            tempDate: getLocalTodayStr()
          });
        } else {
          await persistApplicationRecord(updatedApp);
        }
      }

      async function handleMarkFollowedUp(app) {
        const todayStr = getLocalTodayStr();
        const now = new Date().toISOString();
        const followUpEvent = {
          id: generateId('evt'),
          timestamp: now,
          type: 'followed_up',
          detail: `Completed follow-up on ${todayStr}`
        };
        const updatedApp = {
          ...app,
          followUpDate: '', // Clear reminder; never automatically bump forward
          activityHistory: [...(app.activityHistory || []), followUpEvent],
          updatedAt: now
        };
        await persistApplicationRecord(updatedApp);
        setNextFollowUpPrompt({
          appId: updatedApp.id,
          company: updatedApp.company,
          jobTitle: updatedApp.jobTitle,
          tempDate: ''
        });
      }

      async function handleSaveInlineDate() {
        if (!inlineDateEdit) return;
        const target = applications.find((a) => a.id === inlineDateEdit.appId);
        if (!target) {
          setInlineDateEdit(null);
          return;
        }
        const updated = {
          ...target,
          [inlineDateEdit.field]: inlineDateEdit.value || '',
          updatedAt: new Date().toISOString()
        };
        await persistApplicationRecord(updated);
        setInlineDateEdit(null);
      }

      // ------------------------------------------
      // COMPUTED REMINDERS & ALERTS
      // ------------------------------------------
      const todayLocal = getLocalTodayStr();

      const activeAlerts = useMemo(() => {
        const list = [];
        for (const app of applications) {
          // Rule: Hide alerts for Rejected and Withdrawn without deleting dates
          if (app.status === 'Rejected' || app.status === 'Withdrawn') continue;

          // Rule: Application deadline alerts ONLY shown while status is Saved
          if (app.status === 'Saved' && app.deadline) {
            const diff = diffDaysLocal(app.deadline, todayLocal);
            if (diff !== null && diff <= warningWindowDays) {
              list.push({
                key: `${app.id}_deadline`,
                app,
                alertType: 'Deadline',
                field: 'deadline',
                targetDate: app.deadline,
                diffDays: diff,
                urgency: diff < 0 ? 'Overdue' : diff === 0 ? 'Due today' : 'Approaching'
              });
            }
          }

          // Rule: Follow-up reminders active for Saved, Applied, Assessment, Interview, and Offer
          if (app.followUpDate) {
            const diff = diffDaysLocal(app.followUpDate, todayLocal);
            if (diff !== null && diff <= warningWindowDays) {
              list.push({
                key: `${app.id}_followup`,
                app,
                alertType: 'Follow-up',
                field: 'followUpDate',
                targetDate: app.followUpDate,
                diffDays: diff,
                urgency: diff < 0 ? 'Overdue' : diff === 0 ? 'Due today' : 'Approaching'
              });
            }
          }
        }
        return list.sort((a, b) => a.diffDays - b.diffDays);
      }, [applications, todayLocal, warningWindowDays]);

      // ------------------------------------------
      // COMPUTED STATUS COUNTS & FILTERED LIST
      // ------------------------------------------
      const statusCounts = useMemo(() => {
        const counts = { All: applications.length };
        for (const st of ALLOWED_STATUSES) counts[st] = 0;
        for (const app of applications) {
          if (counts[app.status] !== undefined) counts[app.status]++;
        }
        return counts;
      }, [applications]);

      const filteredAndSortedApps = useMemo(() => {
        const q = searchQuery.trim().toLowerCase();
        const filtered = applications.filter((app) => {
          if (statusFilter !== 'All' && app.status !== statusFilter) return false;
          if (!q) return true;
          return (
            (app.company || '').toLowerCase().includes(q) ||
            (app.jobTitle || '').toLowerCase().includes(q) ||
            (app.location || '').toLowerCase().includes(q) ||
            (app.notes || '').toLowerCase().includes(q) ||
            (app.salaryRange || '').toLowerCase().includes(q)
          );
        });

        return filtered.sort((a, b) => {
          let cmp = 0;
          if (sortBy === 'company') {
            cmp = (a.company || '').localeCompare(b.company || '');
          } else if (sortBy === 'status') {
            cmp = ALLOWED_STATUSES.indexOf(a.status) - ALLOWED_STATUSES.indexOf(b.status);
          } else if (sortBy === 'deadline' || sortBy === 'followUpDate' || sortBy === 'applicationDate') {
            const va = a[sortBy] || '';
            const vb = b[sortBy] || '';
            if (!va && !vb) cmp = 0;
            else if (!va) cmp = 1;
            else if (!vb) cmp = -1;
            else cmp = va.localeCompare(vb);
          } else {
            cmp = new Date(a.updatedAt || 0).getTime() - new Date(b.updatedAt || 0).getTime();
          }
          return sortAsc ? cmp : -cmp;
        });
      }, [applications, searchQuery, statusFilter, sortBy, sortAsc]);

      function handleExportCsvFile() {
        const csvString = serializeApplicationsToCsv(applications);
        const blob = new Blob([csvString], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `application-command-center-backup-${todayLocal}.csv`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }

      // ==========================================
      // RENDER: UNCONFIGURED OR SIGNED-OUT LANDING
      // ==========================================
      const isSignedInCloud = mode === 'firebase' && !!user;
      const isDemoActive = mode === 'demo';

      if (!authLoading && !isSignedInCloud && !isDemoActive) {
        return (
          <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col justify-between p-4 sm:p-8">
            <div className="max-w-3xl w-full mx-auto my-auto space-y-6">
              {/* Welcome Card */}
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 sm:p-8 shadow-2xl space-y-5">
                <div className="flex items-center justify-between flex-wrap gap-3">
                  <div>
                    <span className="text-xs font-mono uppercase tracking-widest px-2.5 py-1 rounded bg-indigo-950 text-indigo-300 border border-indigo-800/60">
                      Linux • SysAdmin • Cloud Engineering
                    </span>
                    <h1 className="text-2xl sm:text-3xl font-bold text-white mt-3">
                      Application Command Center
                    </h1>
                  </div>
                </div>

                <p className="text-sm text-slate-300 leading-relaxed">
                  Track your Linux Administrator, Systems Administrator, and Cloud Engineering job applications in one place. Catch approaching deadlines, stay on top of follow-ups, prevent duplicate submissions, and keep full CSV backups.
                </p>

                {cloudError && (
                  <div className="p-4 rounded-xl bg-rose-950/80 border border-rose-600/60 text-rose-200 text-xs space-y-1">
                    <div className="font-bold text-rose-300">Cloud Authentication / Configuration Error</div>
                    <div>{cloudError}</div>
                  </div>
                )}

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-2">
                  {/* Option 1: Cloud Sync with Google Sign-In */}
                  <div className="p-5 rounded-xl bg-slate-950 border border-slate-800 flex flex-col justify-between space-y-4">
                    <div>
                      <h2 className="text-base font-semibold text-white">Cloud-Synced Account</h2>
                      <p className="text-xs text-slate-400 mt-1 leading-relaxed">
                        Sign in with Google to sync applications automatically across your computers and phone with private per-user Firestore rules.
                      </p>
                    </div>
                    <div className="space-y-2">
                      {mode === 'firebase' ? (
                        <button
                          onClick={handleGoogleSignIn}
                          className="w-full py-2.5 px-4 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs transition shadow"
                        >
                          Sign In with Google
                        </button>
                      ) : null}
                      <button
                        onClick={() => setShowSetupModal(true)}
                        className="w-full py-2.5 px-4 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-medium text-xs transition"
                      >
                        {mode === 'firebase' ? 'Edit Firebase Setup & Rules' : 'Configure Firebase & Security Rules'}
                      </button>
                    </div>
                  </div>

                  {/* Option 2: Explicit Local Demo Mode */}
                  <div className="p-5 rounded-xl bg-slate-950 border border-amber-800/40 flex flex-col justify-between space-y-4">
                    <div>
                      <div className="flex items-center justify-between">
                        <h2 className="text-base font-semibold text-amber-300">Local Demo Mode</h2>
                        <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-amber-950 text-amber-300 border border-amber-700/50">
                          Browser-Only
                        </span>
                      </div>
                      <p className="text-xs text-slate-400 mt-1 leading-relaxed">
                        Test all features immediately before connecting Firebase. Demo data stays strictly in this browser (<code className="text-slate-300">localStorage</code>) and does <strong>not</strong> sync across devices.
                      </p>
                    </div>
                    <button
                      onClick={activateLocalDemoMode}
                      className="w-full py-2.5 px-4 rounded-lg bg-amber-600 hover:bg-amber-500 text-slate-950 font-bold text-xs transition shadow"
                    >
                      Enter Local Demo Mode (Browser-Only)
                    </button>
                  </div>
                </div>
              </div>
            </div>

            {showSetupModal && (
              <FirebaseSetupModal
                onClose={() => setShowSetupModal(false)}
                onSaveConfig={(cfg) => {
                  localStorage.setItem(STORAGE_KEYS.FIREBASE_CONFIG, JSON.stringify(cfg));
                  localStorage.removeItem(STORAGE_KEYS.DEMO_MODE);
                  setShowSetupModal(false);
                  initFirebaseClient(cfg);
                }}
                onClearConfig={() => {
                  localStorage.removeItem(STORAGE_KEYS.FIREBASE_CONFIG);
                  setMode('unconfigured');
                  setShowSetupModal(false);
                }}
              />
            )}
          </div>
        );
      }

      // ==========================================
      // RENDER: MAIN AUTHENTICATED / DEMO DASHBOARD
      // ==========================================
      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col">
          {/* Explicit Local Demo Mode Banner */}
          {isDemoActive && (
            <div className="bg-amber-950/90 border-b border-amber-700/60 px-4 py-2 text-xs text-amber-200 flex items-center justify-between flex-wrap gap-2">

                <strong className="text-amber-300 font-mono">LOCAL DEMO MODE:</strong> Data is stored only in this browser and does NOT sync across devices. Use CSV Export to back up your data.

              <div className="flex items-center gap-2">
                <button

                <button

              </div>

          {/* Header Bar */}
          <header className="bg-slate-900 border-b border-slate-800 sticky top-0 z-20">

                  <h2 className="text-sm font-bold uppercase tracking-wider text-slate-200">
                    Deadlines & Follow-Up Reminders
                  </h2>
                  <span className="text-xs font-mono px-2 py-0.5 rounded-full bg-slate-800 text-slate-300 border border-slate-700">
                    {activeAlerts.length} active
                  </span>
                </div>
                <span className="text-[11px] text-slate-400 font-mono">
                  Local Date: {todayLocal} (Flagging up to {warningWindowDays}d ahead)
                </span>
              </div>

              {activeAlerts.length === 0 ? (
                <div className="p-4 rounded-lg bg-slate-950/70 border border-slate-800/80 text-xs text-slate-400 flex items-center justify-between">
                  <span>
                    All clear — no deadlines (for Saved roles) or follow-ups due within the next {warningWindowDays} {warningWindowDays === 1 ? 'day' : 'days'}.
                  </span>
                </div>
              ) : (
                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                  {activeAlerts.map((item) => {
                    const urgencyStyles =
                      item.urgency === 'Overdue'
                        ? 'bg-rose-950/60 border-rose-600/50 text-rose-200'
                        : item.urgency === 'Due today'
                        ? 'bg-amber-950/60 border-amber-600/50 text-amber-200'
                        : 'bg-indigo-950/50 border-indigo-700/50 text-indigo-200';

                    const badgeStyles =
                      item.urgency === 'Overdue'
                        ? 'bg-rose-600 text-white'
                        : item.urgency === 'Due today'
                        ? 'bg-amber-500 text-slate-950'
                        : 'bg-indigo-600 text-white';

                    const isEditingThisDate =
                      inlineDateEdit &&
                      inlineDateEdit.appId === item.app.id &&
                      inlineDateEdit.field === item.field;

                    return (
                      <div
                        key={item.key}
                        className={`p-3.5 rounded-xl border flex flex-col justify-between gap-3 ${urgencyStyles}`}
                      >
                        <div className="flex items-start justify-between gap-2">
                          <div>
                            <div className="flex items-center gap-2 flex-wrap">
                              <span className={`text-[10px] font-bold uppercase px-2 py-0.5 rounded ${badgeStyles}`}>
                                {item.urgency}
                              </span>
                              <span className="text-xs font-mono font-semibold">
                                {item.alertType}: {item.targetDate}
                              </span>
                              <span className={`text-[10px] px-2 py-0.5 rounded-full border ${getStatusBadgeClasses(item.app.status)}`}>
                                {item.app.status}
                              </span>
                            </div>
                            <h3 className="text-sm font-bold text-white mt-1.5">
                              {item.app.company} — <span className="font-normal text-slate-200">{item.app.jobTitle}</span>
                            </h3>
                          </div>
                        </div>

                        {isEditingThisDate ? (
                          <div className="flex items-center gap-2 bg-slate-950/90 p-2 rounded-lg border border-slate-700">
                            <input
                              type="date"
                              value={inlineDateEdit.value}
                              onChange={(e) => setInlineDateEdit({ ...inlineDateEdit, value: e.target.value })}
                              className="bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs font-mono text-white"
                            />
                            <button
                              onClick={handleSaveInlineDate}
                              className="px-2.5 py-1 bg-emerald-600 hover:bg-emerald-500 text-white rounded text-xs font-medium"
                            >
                              Save
                            </button>
                            <button
                              onClick={() => setInlineDateEdit({ ...inlineDateEdit, value: '' })}
                              className="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded text-xs"
                              title="Clear date"
                            >
                              Clear
                            </button>
                            <button
                              onClick={() => setInlineDateEdit(null)}
                              className="px-2 py-1 text-slate-400 hover:text-white text-xs"
                            >
                              Cancel
                            </button>
                          </div>
                        ) : (
                          <div className="flex items-center flex-wrap gap-2 pt-1">
                            <button
                              onClick={() => {
                                setEditingApp(item.app);
                                setIsAppModalOpen(true);
                              }}
                              className="px-2.5 py-1 rounded bg-slate-900/90 hover:bg-slate-800 text-slate-100 border border-slate-700 text-xs font-medium"
                            >
                              Open application
                            </button>
                            <button
                              onClick={() =>
                                setInlineDateEdit({
                                  appId: item.app.id,
                                  field: item.field,
                                  value: item.targetDate || ''
                                })
                              }
                              className="px-2.5 py-1 rounded bg-slate-900/90 hover:bg-slate-800 text-slate-100 border border-slate-700 text-xs font-medium"
                            >
                              Edit date
                            </button>
                            {item.alertType === 'Follow-up' && (
                              <button
                                onClick={() => handleMarkFollowedUp(item.app)}
                                className="px-2.5 py-1 rounded bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold shadow"
                              >
                                ✓ Mark followed up
                              </button>
                            )}
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              )}
            </section>

            {/* 2. SECOND SECTION: APPLICATION TOTALS BY STATUS */}
            <section className="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-8 gap-2.5">
              {['All', ...ALLOWED_STATUSES].map((st) => {
                const active = statusFilter === st;
                return (
                  <button
                    key={st}
                    onClick={() => setStatusFilter(st)}
                    className={`p-3 rounded-xl border text-left transition ${
                      active
                        ? 'bg-indigo-950/80 border-indigo-500 text-white shadow'
                        : 'bg-slate-900 border-slate-800 text-slate-300 hover:border-slate-700'
                    }`}
                  >
                    <div className="text-[11px] uppercase tracking-wider text-slate-400 font-semibold truncate">
                      {st}
                    </div>
                    <div className="text-xl font-bold font-mono text-white mt-1">
                      {statusCounts[st] || 0}
                    </div>
                  </button>
                );
              })}
            </section>

            {/* 3. SEARCH, FILTER & SORT BAR */}
            <section className="bg-slate-900 border border-slate-800 rounded-xl p-3.5 flex flex-col md:flex-row items-stretch md:items-center justify-between gap-3">
              <div className="flex-1 flex items-center gap-2">
                <input
                  type="text"
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  placeholder="Search company, Linux/Cloud title, location, salary, or notes..."
                  className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3.5 py-2 text-xs text-slate-100 placeholder:text-slate-500 focus:outline-none focus:border-indigo-500"
                />
                {(searchQuery || statusFilter !== 'All') && (
                  <button
                    onClick={() => {
                      setSearchQuery('');
                      setStatusFilter('All');
                    }}
                    className="px-3 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs text-slate-300 whitespace-nowrap"
                  >
                    Reset
                  </button>
                )}
              </div>

              <div className="flex items-center gap-2 flex-wrap">
                <label className="text-xs text-slate-400">Status:</label>
                <select
                  value={statusFilter}
                  onChange={(e) => setStatusFilter(e.target.value)}
                  className="bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1.5 text-xs text-slate-200"
                >
                  <option value="All">All Statuses</option>
                  {ALLOWED_STATUSES.map((st) => (
                    <option key={st} value={st}>{st}</option>
                  ))}
                </select>

                <label className="text-xs text-slate-400 ml-1">Sort by:</label>
                <select
                  value={sortBy}
                  onChange={(e) => setSortBy(e.target.value)}
                  className="bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1.5 text-xs text-slate-200"
                >
                  <option value="updatedAt">Last Updated</option>
                  <option value="deadline">Deadline</option>

            {/* 4. MAIN APPLICATIONS LIST (TABLE ON DESKTOP, CARDS ON MOBILE) */}
            {applications.length === 0 ? (

                {/* MOBILE VIEW: COMPACT CARDS */}
                <div className="md:hidden space-y-3">
                  {filteredAndSortedApps.map((app) => (
                    <div
                      key={app.id}
                      onClick={() => {

                        setIsAppModalOpen(true);
                      }}
                      className="bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-3 cursor-pointer"
                    >
                      <div className="flex items-start justify-between gap-2">
                        <div>
                          <div className="font-bold text-white text-sm flex items-center gap-2">
                            <span>{app.company}</span>
                            {app.postingUrl && (
                              <a
                                href={app.postingUrl}
                                target="_blank"
                                rel="noreferrer"
                                onClick={(e) => e.stopPropagation()}
                                className="text-xs font-mono text-indigo-400 underline"
                              >
                                [Link ↗]
                              </a>
                            )}
                          </div>
                          <div className="text-xs font-mono text-slate-300 mt-0.5">{app.jobTitle}</div>

                        <div onClick={(e) => e.stopPropagation()}>
                          <select
                            value={app.status}
                            onChange={(e) => handleQuickStatusChange(app, e.target.value)}

                      {(app.location || app.salaryRange) && (

                      <div className="grid grid-cols-3 gap-2 pt-2 border-t border-slate-800/80 text-[11px] font-mono">
                        <div>
                          <span className="text-slate-500 block">Applied</span>
                          <span className="text-slate-300">{app.applicationDate || '—'}</span>
                        </div>
                        <div>
                          <span className="text-slate-500 block">Deadline</span>
                          <span className="text-slate-300">{app.deadline || '—'}</span>
                        </div>

                          <span className="text-slate-500 block">Follow-Up</span>

                      <div className="flex items-center justify-end gap-2 pt-1" onClick={(e) => e.stopPropagation()}>

                        >
                          Open / History

                        <button

                              deleteApplicationRecord(app.id);
                            }
                          }}
                          className="px-3 py-1 rounded bg-slate-950 text-rose-400 border border-slate-800 text-xs"

                          Delete
