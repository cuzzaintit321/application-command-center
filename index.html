            )}
          </main>

          {/* ========================================== */}
          {/* MODAL: ADD / EDIT APPLICATION & HISTORY    */}
          {/* ========================================== */}
          {isAppModalOpen && (
            <ApplicationFormModal
              existingApp={editingApp}
              allApplications={applications}
              onClose={() => setIsAppModalOpen(false)}
              onSwitchToExisting={(targetApp) => setEditingApp(targetApp)}
              onSave={async (savedApp, promptForAppliedDate) => {
                await persistApplicationRecord(savedApp);
                setIsAppModalOpen(false);
                if (promptForAppliedDate) {
                  setAppliedDatePrompt({
                    appId: savedApp.id,
                    company: savedApp.company,
                    jobTitle: savedApp.jobTitle,
                    tempDate: getLocalTodayStr()
                  });
                }
              }}
            />
          )}

          {/* ========================================== */}
          {/* MODAL: SAVED -> APPLIED OPTIONAL DATE      */}
          {/* ========================================== */}
          {appliedDatePrompt && (
            <div className="fixed inset-0 z-50 bg-black/75 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 rounded-xl max-w-md w-full p-6 space-y-4 shadow-2xl">
                <h3 className="text-base font-bold text-white">
                  Set Application Date? (Optional)
                </h3>
                <p className="text-xs text-slate-300 leading-relaxed">
                  You changed <strong>{appliedDatePrompt.company} — {appliedDatePrompt.jobTitle}</strong> to <strong>Applied</strong>. The status change timestamp has been recorded in Activity History. Would you also like to set an Application Date, or leave it blank?
                </p>
                <div>
                  <label className="block text-xs text-slate-400 mb-1">Application Date</label>
                  <input
                    type="date"
                    value={appliedDatePrompt.tempDate}
                    onChange={(e) => setAppliedDatePrompt({ ...appliedDatePrompt, tempDate: e.target.value })}
                    className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs font-mono text-white"
                  />
                </div>
                <div className="flex items-center justify-end gap-2 pt-2">
                  <button
                    onClick={() => setAppliedDatePrompt(null)}
                    className="px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-medium text-slate-200"
                  >
                    Skip (Leave Blank)
                  </button>
                  <button
                    onClick={async () => {
                      const target = applications.find((a) => a.id === appliedDatePrompt.appId);
                      if (target && appliedDatePrompt.tempDate) {
                        await persistApplicationRecord({
                          ...target,
                          applicationDate: appliedDatePrompt.tempDate,
                          updatedAt: new Date().toISOString()
                        });
                      }
                      setAppliedDatePrompt(null);
                    }}
                    className="px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-xs font-semibold text-white"
                  >
                    Save Application Date
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ========================================== */}
          {/* MODAL: SCHEDULE NEXT FOLLOW-UP PROMPT      */}
          {/* ========================================== */}
          {nextFollowUpPrompt && (
            <div className="fixed inset-0 z-50 bg-black/75 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 rounded-xl max-w-md w-full p-6 space-y-4 shadow-2xl">
                <h3 className="text-base font-bold text-emerald-400">
                  ✓ Follow-Up Recorded in Activity History
                </h3>
                <p className="text-xs text-slate-300 leading-relaxed">
                  Today's follow-up for <strong>{nextFollowUpPrompt.company} — {nextFollowUpPrompt.jobTitle}</strong> was logged and the reminder was cleared. Would you like to schedule another follow-up date?
                </p>
                <div>
                  <label className="block text-xs text-slate-400 mb-1">Next Follow-Up Date (Optional)</label>
                  <input
                    type="date"
                    value={nextFollowUpPrompt.tempDate}
                    onChange={(e) => setNextFollowUpPrompt({ ...nextFollowUpPrompt, tempDate: e.target.value })}
                    className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs font-mono text-white"
                  />
                </div>
                <div className="flex items-center justify-end gap-2 pt-2">
                  <button
                    onClick={() => setNextFollowUpPrompt(null)}
                    className="px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-medium text-slate-200"
                  >
                    Done (Keep Cleared)
                  </button>
                  <button
                    disabled={!nextFollowUpPrompt.tempDate}
                    onClick={async () => {
                      const target = applications.find((a) => a.id === nextFollowUpPrompt.appId);
                      if (target && nextFollowUpPrompt.tempDate) {
                        await persistApplicationRecord({
                          ...target,
                          followUpDate: nextFollowUpPrompt.tempDate,
                          updatedAt: new Date().toISOString()
                        });
                      }
                      setNextFollowUpPrompt(null);
                    }}
                    className="px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 disabled:opacity-40 text-xs font-semibold text-white"
                  >
                    Schedule Next Follow-Up
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ========================================== */}
          {/* MODAL: CSV IMPORT WITH PREVIEW & CONFLICTS */}
          {/* ========================================== */}
          {isCsvModalOpen && (
            <CsvImportModal
              existingApplications={applications}
              onClose={() => setIsCsvModalOpen(false)}
              onCommitImport={async (recordsToSave) => {
                for (const rec of recordsToSave) {
                  await persistApplicationRecord(rec);
                }
                setIsCsvModalOpen(false);
              }}
            />
          )}

          {/* ========================================== */}
          {/* MODAL: FIREBASE SETUP & SECURITY RULES     */}
          {/* ========================================== */}
          {showSetupModal && (
            <FirebaseSetupModal
              onClose={() => setShowSetupModal(false)}
              onSaveConfig={(cfg) => {
                localStorage.setItem(STORAGE_KEYS.FIREBASE_CONFIG, JSON.stringify(cfg));
                localStorage.removeItem(STORAGE_KEYS.DEMO_MODE);
                setShowSetupModal(false);
                initFirebaseClient(cfg);
              }}
              onClearConfig={() => {
                localStorage.removeItem(STORAGE_KEYS.FIREBASE_CONFIG);
                setMode('unconfigured');
                setShowSetupModal(false);
              }}
            />
          )}
        </div>
      );
    }

    // ==========================================
    // COMPONENT: ADD / EDIT APPLICATION MODAL
    // ==========================================
    function ApplicationFormModal({ existingApp, allApplications, onClose, onSwitchToExisting, onSave }) {
      const [company, setCompany] = useState(existingApp?.company || '');
      const [jobTitle, setJobTitle] = useState(existingApp?.jobTitle || '');
      const [status, setStatus] = useState(existingApp?.status || 'Saved');
      const [postingUrl, setPostingUrl] = useState(existingApp?.postingUrl || '');
      const [salaryRange, setSalaryRange] = useState(existingApp?.salaryRange || '');
      const [location, setLocation] = useState(existingApp?.location || '');
      const [applicationDate, setApplicationDate] = useState(existingApp?.applicationDate || '');
      const [deadline, setDeadline] = useState(existingApp?.deadline || '');
      const [followUpDate, setFollowUpDate] = useState(existingApp?.followUpDate || '');
      const [notes, setNotes] = useState(existingApp?.notes || '');
      const [formError, setFormError] = useState(null);

      // Duplicate warning state before final save
      const [duplicateMatches, setDuplicateMatches] = useState(null);

      // Sync form if user clicks "Open / Edit Existing Entry" from duplicate warning
      useEffect(() => {
        setCompany(existingApp?.company || '');
        setJobTitle(existingApp?.jobTitle || '');
        setStatus(existingApp?.status || 'Saved');
        setPostingUrl(existingApp?.postingUrl || '');
        setSalaryRange(existingApp?.salaryRange || '');
        setLocation(existingApp?.location || '');
        setApplicationDate(existingApp?.applicationDate || '');
        setDeadline(existingApp?.deadline || '');
        setFollowUpDate(existingApp?.followUpDate || '');
        setNotes(existingApp?.notes || '');
        setDuplicateMatches(null);
        setFormError(null);
      }, [existingApp]);

      function buildRecordPayload() {
        const now = new Date().toISOString();
        const baseHistory = Array.isArray(existingApp?.activityHistory)
          ? [...existingApp.activityHistory]
          : [
              {
                id: generateId('evt'),
                timestamp: now,
                type: 'created',
                detail: `Created application with status ${status}`
              }
            ];

        if (existingApp && existingApp.status !== status) {
          baseHistory.push({
            id: generateId('evt'),
            timestamp: now,
            type: 'status_change',
            detail: `Status changed from ${existingApp.status} to ${status}`
          });
        }

        return {
          id: existingApp?.id || generateId('app'),
          company: company.trim(),
          jobTitle: jobTitle.trim(),
          status,
          postingUrl: postingUrl.trim(),
          salaryRange: salaryRange.trim(),
          location: location.trim(),
          // Strict Rule: Never automatically assign applicationDate
          applicationDate: applicationDate.trim(),
          deadline: deadline.trim(),
          followUpDate: followUpDate.trim(),
          notes: notes.trim(),
          activityHistory: baseHistory,
          createdAt: existingApp?.createdAt || now,
          updatedAt: now
        };
      }

      async function handleFormSubmit(e,confirmedDuplicateBypass = false) {
        if (e) e.preventDefault();
        setFormError(null);

        if (!company.trim() || !jobTitle.trim() || !ALLOWED_STATUSES.includes(status)) {
          setFormError('Company, Job Title, and a valid Status are required.');
          return;
        }

        const candidate = buildRecordPayload();

        if (!confirmedDuplicateBypass) {
          const matches = [];
          for (const other of allApplications) {
            if (existingApp && other.id === existingApp.id) continue;
            const res = checkDuplicateMatch(candidate, other);
            if (res.isDuplicate) {
              matches.push({ record: other, reasons: res.reasons });
            }
          }
          if (matches.length > 0) {
            setDuplicateMatches(matches);
            return;
          }
        }

        const transitionedSavedToAppliedBlankDate =
          existingApp &&
          existingApp.status === 'Saved' &&
          status === 'Applied' &&
          !candidate.applicationDate;

        await onSave(candidate, transitionedSavedToAppliedBlankDate);
      }

      return (
        <div className="fixed inset-0 z-40 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
          <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-3xl w-full max-h-[92vh] flex flex-col overflow-hidden shadow-2xl">
            <div className="px-6 py-4 bg-slate-950 border-b border-slate-800 flex items-center justify-between">
              <h2 className="text-base font-bold text-white">
                {existingApp ? `Edit Application — ${existingApp.company}` : 'Add Job Application'}
              </h2>
              <button onClick={onClose} className="text-slate-400 hover:text-white text-sm">✕</button>
            </div>

            <form onSubmit={(e) => handleFormSubmit(e, false)} className="p-6 overflow-y-auto space-y-5 text-xs">
              {formError && (
                <div className="p-3 rounded-lg bg-rose-950/80 border border-rose-600 text-rose-200">
                  {formError}
                </div>
              )}

              {/* Duplicate Warning Banner Inside Modal */}
              {duplicateMatches && (
                <div className="p-4 rounded-xl bg-amber-950/80 border-2 border-amber-500 text-amber-100 space-y-3">
                  <div className="font-bold text-sm text-amber-300">
                    ⚠️ Possible Duplicate Application Detected ({duplicateMatches.length})
                  </div>
                  <p className="text-xs text-amber-200">
                    We found existing saved application(s) matching this URL or Company + Job Title. Choose how to proceed:
                  </p>
                  <div className="space-y-2 max-h-40 overflow-y-auto">
                    {duplicateMatches.map(({ record, reasons }) => (
                      <div key={record.id} className="p-3 rounded-lg bg-slate-950 border border-amber-700/50 flex items-center justify-between gap-2">
                        <div>
                          <div className="font-bold text-white">
                            {record.company} — {record.jobTitle} <span className="text-amber-300 font-mono">[{record.status}]</span>
                          </div>
                          <div className="text-[11px] text-amber-300/90 mt-0.5">
                            Match reason: {reasons.join(', ')}
                          </div>
                          {record.postingUrl && (
                            <div className="text-[10px] font-mono text-slate-400 truncate max-w-md">
                              URL: {record.postingUrl}
                            </div>
                          )}
                        </div>
                        <button
                          type="button"
                          onClick={() => onSwitchToExisting(record)}
                          className="px-3 py-1.5 rounded bg-indigo-600 hover:bg-indigo-500 text-white font-semibold whitespace-nowrap"
                        >
                          Open / Edit Existing
                        </button>
                      </div>
                    ))}
                  </div>
                  <div className="flex items-center justify-end gap-2 pt-2">
                    <button
                      type="button"
                      onClick={onClose}
                      className="px-3 py-1.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-200"
                    >
                      Skip / Cancel New Entry
                    </button>
                    <button
                      type="button"
                      onClick={() => handleFormSubmit(null, true)}
                      className="px-3.5 py-1.5 rounded bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold"
                    >
                      Save Anyway (Confirm)
                    </button>
                  </div>
                </div>
              )}

              {/* Required Fields */}
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div>
                  <label className="block text-slate-300 font-semibold mb-1">
                    Company <span className="text-rose-400">*</span>
                  </label>
                  <input
                    type="text"
                    required
                    value={company}
                    onChange={(e) => setCompany(e.target.value)}
                    placeholder="e.g. Red Hat, Cloudflare"
                    className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white focus:border-indigo-500 focus:outline-none"
                  />
                </div>
                <div>
                  <label className="block text-slate-300 font-semibold mb-1">
                    Job Title <span className="text-rose-400">*</span>
                  </label>
                  <input
                    type="text"
                    required
                    value={jobTitle}
                    onChange={(e) => setJobTitle(e.target.value)}
                    placeholder="e.g. Linux Systems Administrator"
                    className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white focus:border-indigo-500 focus:outline-none"
                  />
                </div>
                <div>
                  <label className="block text-slate-300 font-semibold mb-1">
                    Status <span className="text-rose-400">*</span>
                  </label>
                  <select
                    value={status}
                    onChange={(e) => setStatus(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white focus:border-indigo-500 focus:outline-none"
                  >
                    {ALLOWED_STATUSES.map((st) => (
                      <option key={st} value={st}>{st}</option>
                    ))}
                  </select>
                </div>
              </div>

              {/* Optional Job Details */}
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div className="sm:col-span-1">
                  <label className="block text-slate-400 mb-1">Posting URL (Optional)</label>
                  <input
                    type="url"
                    value={postingUrl}
                    onChange={(e) => setPostingUrl(e.target.value)}
                    placeholder="https://..."
                    className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white font-mono focus:border-indigo-500 focus:outline-none"
                  />
                </div>
                <div>
                  <label className="block text-slate-400 mb-1">Salary Range (Optional)</label>
                  <input
                    type="text"
                    value={salaryRange}
                    onChange={(e) => setSalaryRange(e.target.value)}
                    placeholder="e.g. $115k - $135k"
                    className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white font-mono focus:border-indigo-500 focus:outline-none"
                  />
                </div>
                <div>
                  <label className="block text-slate-400 mb-1">Location (Optional)</label>
                  <input
                    type="text"
                    value={location}
                    onChange={(e) => setLocation(e.target.value)}
                    placeholder="e.g. Remote / Orlando, FL"
                    className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white focus:border-indigo-500 focus:outline-none"
                  />
                </div>
              </div>

              {/* Optional Dates (Never Invented) */}
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 pt-2 border-t border-slate-800">
                <div>
                  <div className="flex items-center justify-between mb-1">
                    <label className="text-slate-400">Application Date</label>
                    {applicationDate && (
                      <button type="button" onClick={() => setApplicationDate('')} className="text-[10px] text-slate-500 hover:text-slate-300">Clear</button>
                    )}
                  </div>
                  <input
                    type="date"
                    value={applicationDate}
                    onChange={(e) => setApplicationDate(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white font-mono"
                  />
                </div>
                <div>
                  <div className="flex items-center justify-between mb-1">
                    <label className="text-slate-400">Deadline (Alert if Saved)</label>
                    {deadline && (
                      <button type="button" onClick={() => setDeadline('')} className="text-[10px] text-slate-500 hover:text-slate-300">Clear</button>
                    )}
                  </div>
                  <input
                    type="date"
                    value={deadline}
                    onChange={(e) => setDeadline(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white font-mono"
                  />
                </div>
                <div>
                  <div className="flex items-center justify-between mb-1">
                    <label className="text-slate-400">Follow-up Date</label>
                    {followUpDate && (
                      <button type="button" onClick={() => setFollowUpDate('')} className="text-[10px] text-slate-500 hover:text-slate-300">Clear</button>
                    )}
                  </div>
                  <input
                    type="date"
                    value={followUpDate}
                    onChange={(e) => setFollowUpDate(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white font-mono"
                  />
                </div>
              </div>

              {/* Notes */}
              <div>
                <label className="block text-slate-400 mb-1">Notes (Optional)</label>
                <textarea
                  rows="3"
                  value={notes}
                  onChange={(e) => setNotes(e.target.value)}
                  placeholder="Key requirements (RHEL, Ansible, Terraform, AWS/GCP), recruiter contact, or interview notes..."
                  className="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-white focus:border-indigo-500 focus:outline-none"
                />
              </div>

              {/* Activity History Timeline */}
              {existingApp && Array.isArray(existingApp.activityHistory) && (
                <div className="pt-3 border-t border-slate-800 space-y-2">
                  <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400">
                    Activity History ({existingApp.activityHistory.length})
                  </h3>
                  <div className="bg-slate-950 border border-slate-800 rounded-lg p-3 max-h-40 overflow-y-auto space-y-2">
                    {existingApp.activityHistory.map((evt) => (
                      <div key={evt.id} className="flex items-start justify-between gap-2 text-[11px] border-b border-slate-900 pb-1.5 last:border-none last:pb-0">
                        <span className="text-slate-200">{evt.detail}</span>
                        <span className="text-slate-500 font-mono whitespace-nowrap">
                          {formatLocalTimestamp(evt.timestamp)}
                        </span>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              <div className="flex items-center justify-end gap-2 pt-3 border-t border-slate-800">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium"
                >
                  Cancel
                </button>
                <button
                  type="submit"
                  className="px-5 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-semibold shadow"
                >
                  {existingApp ? 'Save Changes' : 'Save Application'}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // ==========================================
    // COMPONENT: CSV IMPORT & CONFLICT MODAL
    // ==========================================
    function CsvImportModal({ existingApplications, onClose, onCommitImport }) {
      const [parseError, setParseError] = useState(null);
      const [reviewRows, setReviewRows] = useState([]);

      function handleFileUpload(e) {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => processCsvContent(String(evt.target?.result || ''));
        reader.readAsText(file);
      }

      function processCsvContent(rawText) {
        setParseError(null);
        setReviewRows([]);
        if (!rawText.trim()) {
          setParseError('The CSV file is empty.');
          return;
        }

        const rows = parseRfc4180Csv(rawText.trim());
        if (rows.length < 2) {
          setParseError('CSV must include a header row and at least one application row.');
          return;
        }

        const header = rows[0].map((h) => h.trim());
        const idxMap = {};
        header.forEach((h, idx) => { idxMap[h] = idx; });

        if (idxMap.company === undefined || idxMap.jobTitle === undefined) {
          setParseError('CSV header must include at least "company" and "jobTitle" columns.');
          return;
        }

        const parsedItems = [];
        const seenInCsv = [];

        for (let i = 1; i < rows.length; i++) {
          const r = rows[i];
          if (r.length === 1 && !r[0].trim()) continue;

          const getCol = (name) => (idxMap[name] !== undefined && r[idxMap[name]] !== undefined ? r[idxMap[name]].trim() : '');

          const company = getCol('company');
          const jobTitle = getCol('jobTitle');
          if (!company || !jobTitle) continue;

          const rawStatus = getCol('status');
          const status = ALLOWED_STATUSES.includes(rawStatus) ? rawStatus : 'Saved';
          const rowId = getCol('id') || generateId('app');

          let parsedHistory = [];
          const rawHistory = getCol('activityHistory');
          if (rawHistory) {
            try {
              const arr = JSON.parse(rawHistory);
              if (Array.isArray(arr)) parsedHistory = arr;
            } catch (err) {
              // Keep safe fallback if malformed JSON
            }
          }
          if (parsedHistory.length === 0) {
            parsedHistory = [{
              id: generateId('evt'),
              timestamp: new Date().toISOString(),
              type: 'created',
              detail: `Imported from CSV with status ${status}`
            }];
          }

          const candidate = {
            id: rowId,
            company,
            jobTitle,
            status,
            postingUrl: getCol('postingUrl'),
            salaryRange: getCol('salaryRange'),
            location: getCol('location'),
            applicationDate: getCol('applicationDate'),
            deadline: getCol('deadline'),
            followUpDate: getCol('followUpDate'),
            notes: getCol('notes'),
            activityHistory: parsedHistory,
            createdAt: new Date().toISOString(),
            updatedAt: new Date().toISOString()
          };

          // 1. Check Exact ID Conflict against existing DB
          const existingById = existingApplications.find((a) => a.id === candidate.id);

          // 2. Check URL / Company+Title Duplicate against DB
          let dbDuplicate = null;
          let dbReasons = [];
          for (const ex of existingApplications) {
            if (existingById && ex.id === existingById.id) continue;
            const check = checkDuplicateMatch(candidate, ex);
            if (check.isDuplicate) {
              dbDuplicate = ex;
              dbReasons = check.reasons;
              break;
            }
          }

          // 3. Check URL / Company+Title Duplicate against earlier rows in same CSV
          let csvDuplicate = null;
          let csvReasons = [];
          for (const prev of seenInCsv) {
            const check = checkDuplicateMatch(candidate, prev);
            if (check.isDuplicate) {
              csvDuplicate = prev;
              csvReasons = check.reasons;
              break;
            }
          }

          seenInCsv.push(candidate);

          let conflictType = 'clean';
          let resolution = 'import'; // 'import' | 'skip' | 'replace_dedup' | 'import_new_id'
          let matchSummary = '';

          if (existingById) {
            conflictType = 'id_conflict';
            resolution = 'skip'; // Never silently overwrite
            matchSummary = `Existing ID (${existingById.id}) for ${existingById.company} — ${existingById.jobTitle}`;
          } else if (dbDuplicate) {
            conflictType = 'duplicate';
            resolution = 'skip';
            matchSummary = `Matches saved entry "${dbDuplicate.company} — ${dbDuplicate.jobTitle}" (${dbReasons.join(', ')})`;
          } else if (csvDuplicate) {
            conflictType = 'duplicate';
            resolution = 'skip';
            matchSummary = `Matches earlier CSV row "${csvDuplicate.company} — ${csvDuplicate.jobTitle}" (${csvReasons.join(', ')})`;
          }

          parsedItems.push({
            rowIndex: i,
            candidate,
            existingById,
            conflictType,
            resolution,
            matchSummary
          });
        }

        setReviewRows(parsedItems);
      }

      function updateRowResolution(idx, newResolution) {
        setReviewRows((prev) =>
          prev.map((item, i) => (i === idx ? { ...item, resolution: newResolution } : item))
        );
      }

      function handleConfirmBatch() {
        const finalRecords = [];
        for (const item of reviewRows) {
          if (item.resolution === 'skip') continue;
          if (item.conflictType === 'id_conflict' && item.existingById) {
            if (item.resolution === 'replace_dedup') {
              const mergedHistory = mergeActivityHistories(
                item.existingById.activityHistory,
                item.candidate.activityHistory
              );
              finalRecords.push({
                ...item.candidate,
                id: item.existingById.id,
                createdAt: item.existingById.createdAt || item.candidate.createdAt,
                activityHistory: mergedHistory
              });
            } else if (item.resolution === 'import_new_id') {
              finalRecords.push({
                ...item.candidate,
                id: generateId('app')
              });
            }
          } else {
            finalRecords.push(item.candidate);
          }
        }
        onCommitImport(finalRecords);
      }

      return (
        <div className="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-4xl w-full max-h-[90vh] flex flex-col overflow-hidden shadow-2xl text-xs">
            <div className="px-6 py-4 bg-slate-950 border-b border-slate-800 flex items-center justify-between">
              <h2 className="text-base font-bold text-white">CSV Import & Duplicate Review</h2>
              <button onClick={onClose} className="text-slate-400 hover:text-white">✕</button>
            </div>

            <div className="p-6 overflow-y-auto space-y-5">
              <div className="p-4 rounded-xl bg-slate-950 border border-slate-800 space-y-2">
                <label className="block font-semibold text-slate-200">Select CSV Backup File</label>
                <input
                  type="file"
                  accept=".csv,text/csv"
                  onChange={handleFileUpload}
                  className="block w-full text-xs text-slate-300 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500"
                />
                <p className="text-[11px] text-slate-400">
                  Supports RFC 4180 CSV files with JSON-encoded <code className="text-indigo-300">activityHistory</code> arrays. Checks against both your saved applications and other rows in the CSV file.
                </p>
              </div>

              {parseError && (
                <div className="p-3 rounded-lg bg-rose-950 border border-rose-600 text-rose-200">
                  {parseError}
                </div>
              )}

              {reviewRows.length > 0 && (
                <div className="space-y-3">
                  <div className="flex items-center justify-between">
                    <span className="font-bold text-white">
                      Previewing {reviewRows.length} CSV Rows
                    </span>
                    <span className="text-slate-400 font-mono">
                      {reviewRows.filter((r) => r.resolution !== 'skip').length} selected to import
                    </span>
                  </div>

                  <div className="border border-slate-800 rounded-xl overflow-hidden max-h-80 overflow-y-auto">
                    <table className="w-full text-left text-xs">
                      <thead className="bg-slate-950 text-slate-400 uppercase text-[10px]">
                        <tr>
                          <th className="py-2.5 px-3">Row</th>
                          <th className="py-2.5 px-3">Company & Role</th>
                          <th className="py-2.5 px-3">Status</th>
                          <th className="py-2.5 px-3">Check Result</th>
                          <th className="py-2.5 px-3">Action</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800">
                        {reviewRows.map((item, idx) => (
                          <tr key={idx} className={item.conflictType !== 'clean' ? 'bg-amber-950/20' : 'bg-slate-900'}>
                            <td className="py-2.5 px-3 font-mono text-slate-400">#{item.rowIndex}</td>
                            <td className="py-2.5 px-3">
                              <div className="font-semibold text-white">{item.candidate.company}</div>
                              <div className="text-slate-400 font-mono">{item.candidate.jobTitle}</div>
                            </td>
                            <td className="py-2.5 px-3">
                              <span className={`px-2 py-0.5 rounded-full border text-[10px] ${getStatusBadgeClasses(item.candidate.status)}`}>
                                {item.candidate.status}
                              </span>
                            </td>
                            <td className="py-2.5 px-3">
                              {item.conflictType === 'clean' ? (
                                <span className="text-emerald-400 font-medium">✓ Clean new entry</span>
                              ) : (
                                <span className="text-amber-300">{item.matchSummary}</span>
                              )}
                            </td>
                            <td className="py-2.5 px-3">
                              {item.conflictType === 'id_conflict' ? (
                                <select
                                  value={item.resolution}
                                  onChange={(e) => updateRowResolution(idx, e.target.value)}
                                  className="bg-slate-950 border border-amber-600/60 rounded px-2 py-1 text-amber-200"
                                >
                                  <option value="skip">Skip (Keep Existing)</option>
                                  <option value="replace_dedup">Replace & Deduplicate History</option>
                                  <option value="import_new_id">Import as New ID</option>
                                </select>
                              ) : (
                                <select
                                  value={item.resolution}
                                  onChange={(e) => updateRowResolution(idx, e.target.value)}
                                  className="bg-slate-950 border border-slate-700 rounded px-2 py-1 text-slate-200"
                                >
                                  <option value="import">Keep / Import Row</option>
                                  <option value="skip">Skip Row</option>
                                </select>
                              )}
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>

                  <div className="flex items-center justify-end gap-2 pt-2">
                    <button
                      onClick={onClose}
                      className="px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300"
                    >
                      Cancel
                    </button>
                    <button
                      onClick={handleConfirmBatch}
                      className="px-5 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-semibold shadow"
                    >
                      Complete Import ({reviewRows.filter((r) => r.resolution !== 'skip').length} rows)
                    </button>
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // COMPONENT: FIREBASE SETUP & SECURITY RULES
    // ==========================================
    function FirebaseSetupModal({ onClose, onSaveConfig, onClearConfig }) {
      const existingRaw = localStorage.getItem(STORAGE_KEYS.FIREBASE_CONFIG);
      const [jsonInput, setJsonInput] = useState(existingRaw || '');
      const [error, setError] = useState(null);
      const [copied, setCopied] = useState(false);

      const securityRulesText = `rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    match /users/{userId}/{document=**} {
      allow read, write: if request.auth != null && request.auth.uid == userId;
    }
  }
}`;

      function handleSave() {
        setError(null);
        try {
          const cleaned = jsonInput
            .trim()
            .replace(/^(const|let|var)\s+\w+\s*=\s*/, '')
            .replace(/;$/, '');
          const parsed = JSON.parse(cleaned);
          if (!parsed.apiKey || !parsed.authDomain || !parsed.projectId || !parsed.appId) {
            setError('Config JSON must include apiKey, authDomain, projectId, and appId.');
            return;
          }
          onSaveConfig(parsed);
        } catch (e) {
          setError('Invalid JSON format. Ensure keys and values are wrapped in double quotes.');
        }
      }

      return (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-3xl w-full max-h-[92vh] flex flex-col overflow-hidden shadow-2xl text-xs">
            <div className="px-6 py-4 bg-slate-950 border-b border-slate-800 flex items-center justify-between">
              <h2 className="text-base font-bold text-white">Firebase Cloud Sync & Security Rules Setup</h2>
              <button onClick={onClose} className="text-slate-400 hover:text-white">✕</button>
            </div>

            <div className="p-6 overflow-y-auto space-y-5 text-slate-300">
              <div className="p-4 rounded-xl bg-amber-950/60 border border-amber-600/60 text-amber-200 space-y-1">
                <div className="font-bold text-amber-300">Important Security Notice</div>
                <p className="leading-relaxed">
                  Pasting your Firebase Web Config JSON below <strong>only connects the browser SDK</strong>. It does <strong>not</strong> automatically enable Google Sign-In or deploy database access rules. You must complete Steps 2 and 3 in the Firebase Console to enforce per-user privacy.
                </p>
              </div>

              <div className="space-y-3">
                <div className="p-3.5 rounded-lg bg-slate-950 border border-slate-800">
                  <div className="font-bold text-white">Step 1: Create a Firebase Web App</div>
                  <p className="text-slate-400 mt-1">
                    In the Firebase Console, create a project, register a Web App, and copy the <code className="text-indigo-300">firebaseConfig</code> JSON object.
                  </p>
                </div>

                <div className="p-3.5 rounded-lg bg-slate-950 border border-slate-800">
                  <div className="font-bold text-white">Step 2: Enable Google Sign-In & Authorized Domains</div>
                  <p className="text-slate-400 mt-1">
                    Go to <strong>Authentication → Sign-in method</strong> and enable <strong>Google</strong>. Under <strong>Authentication → Settings → Authorized domains</strong>, ensure <code className="text-indigo-300">{window.location.hostname || 'localhost'}</code> is listed.
                  </p>
                </div>

                <div className="p-3.5 rounded-lg bg-slate-950 border border-slate-800 space-y-2">
                  <div className="flex items-center justify-between">
                    <span className="font-bold text-white">Step 3: Deploy Firestore Security Rules (Required for User Isolation)</span>
                    <button
                      type="button"
                      onClick={() => {
                        navigator.clipboard.writeText(securityRulesText);
                        setCopied(true);
                        setTimeout(() => setCopied(false), 2000);
                      }}
                      className="px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700 text-indigo-300 border border-slate-700"
                    >
                      {copied ? '✓ Copied Rules' : 'Copy Security Rules'}
                    </button>
                  </div>
                  <pre className="p-3 rounded bg-slate-900 border border-slate-800 text-emerald-400 font-mono overflow-x-auto">
                    {securityRulesText}
                  </pre>
                </div>
              </div>

              <div>
                <label className="block font-bold text-white mb-1.5">Paste Firebase Web Config JSON</label>
                <textarea
                  rows="6"
                  value={jsonInput}
                  onChange={(e) => setJsonInput(e.target.value)}
                  placeholder={'{\n  "apiKey": "AIza...",\n  "authDomain": "your-project.firebaseapp.com",\n  "projectId": "your-project",\n  "storageBucket": "your-project.appspot.com",\n  "messagingSenderId": "123456789",\n  "appId": "1:123456789:web:abcdef"\n}'}
                  className="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 font-mono text-white focus:border-indigo-500 focus:outline-none"
                />
                {error && <p className="text-rose-400 mt-1.5 font-medium">{error}</p>}
              </div>

              <div className="flex items-center justify-between pt-2 border-t border-slate-800">
                {existingRaw ? (
                  <button
                    type="button"
                    onClick={onClearConfig}
                    className="px-3 py-2 rounded-lg bg-rose-950/60 hover:bg-rose-900 text-rose-300 border border-rose-800/50"
                  >
                    Disconnect / Clear Config
                  </button>
                ) : <div />}
                <div className="flex items-center gap-2">
                  <button
                    type="button"
                    onClick={onClose}
                    className="px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300"
                  >
                    Cancel
                  </button>
                  <button
                    type="button"
                    onClick={handleSave}
                    className="px-5 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-semibold shadow"
                  >
                    Save & Connect Firebase
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
